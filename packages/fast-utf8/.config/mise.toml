[tasks.test]
run = [
  { task = "test:server" },
  { task = "test:client" },
  { task = "test:format" },
  { task = "test:lint" },
  { task = "test:typecheck" },
]
env = { CI = 1 }

[tasks."test:server"]
run = "npx vitest --config ./.config/vitest.server.ts"

[tasks."test:client"]
run = "npx vitest --config ./.config/vitest.client.ts"

[tasks."test:coverage"]
run = [{ task = "test:coverage:server" }, { task = "test:coverage:client" }]
env = { CI = 1 }

[tasks."test:coverage:server"]
run = "npx vitest run --coverage --config ./.config/vitest.server.ts"

[tasks."test:coverage:client"]
run = "npx vitest run --coverage --config ./.config/vitest.client.ts"

[tasks."test:format"]
run = { task = "format", args = ["--check"] }

[tasks."test:lint"]
run = { task = "lint" }

[tasks."test:typecheck"]
run = [
  "npx tsc --noEmit --project ./.config/tsconfig.base.json",
  "npx tsc --noEmit --project ./.config/tsconfig.test.json",
  "npx tsc --noEmit --project ./.config/tsconfig.bench.json",
  "npx tsc --noEmit --project ./.config/tsconfig.client.json",
  "npx tsc --noEmit --project ./.config/tsconfig.server.json",
  "npx tsc --noEmit --project ./.config/tsconfig.config.json",
]

[tasks.bench]
description = "Node.js と各ブラウザーでベンチマークを計測し ./.tmp/benchmarks/<日時>/ に JSON で保存します。"
run = "node ./.config/bench.ts"

[tasks."bench:node"]
description = "Node.js でベンチマークを計測します。"
run = "node ./.config/bench.ts node"

[tasks."bench:chromium"]
description = "Chromium でベンチマークを計測します。"
run = "node ./.config/bench.ts chromium"

[tasks."bench:firefox"]
description = "Firefox でベンチマークを計測します。"
run = "node ./.config/bench.ts firefox"

[tasks."bench:webkit"]
description = "WebKit でベンチマークを計測します。"
run = "node ./.config/bench.ts webkit"

[tasks.format]
run = "set -e; cp ./.config/.oxfmtrc.json ./.tmp-oxfmtrc.json; trap 'rm -f ./.tmp-oxfmtrc.json' EXIT; npx oxfmt --config ./.tmp-oxfmtrc.json"

[tasks.lint]
run = "set -e; cp ./.config/.oxlintrc.json ./.tmp-oxlintrc.json; trap 'rm -f ./.tmp-oxlintrc.json' EXIT; npx oxlint --config ./.tmp-oxlintrc.json"

[tasks.update]
run = ["npx npm-check-updates --target minor -u --cooldown 7", "npx playwright install --with-deps"]
